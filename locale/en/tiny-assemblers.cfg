[entity-name]
tiny-assembling-machine-suffix=(tiny)

[mod-setting-name]
tiny-assembling-machine-cost=Tiny cost scalar
tiny-assembling-machine-modules=Modules
tiny-assembling-accept-fluids=Accept fluids
tiny-assembling-fluid-volume=Fluid volume scalar

[mod-setting-description]
tiny-assembling-machine-cost=How expensive tiny assemblers are compared to their full-sized counterparts (uses ceiling, so will never be <1 per ingredient)
tiny-assembling-machine-modules=How many modules tiny assemblers can use! (WARNING: Lowering this will ERASE modules beyond the new max)
tiny-assembling-accept-fluids=Whether to accept fluids or not
tiny-assembling-fluid-volume=Fluid box volume modifier (how much it can hold as input or output as part of a pipe system)
